<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PassEvolver Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="popup-container">
    <!-- Popup Header -->
    <header class="popup-header">
      <div class="brand-row">
        <h1 class="brand-title">PassEvolver</h1>
        <span class="version-tag">EXT V1.2</span>
      </div>
      <div id="domain-chip" class="domain-chip" title="Active Tab Domain">
        <span class="dot"></span>
        <span id="domain-text">Detecting site...</span>
      </div>
    </header>

    <!-- Phrase Input -->
    <div class="field-block">
      <label for="phrase-input" class="field-label">MEMORABLE PHRASE</label>
      <input type="password" id="phrase-input" class="popup-input" placeholder="Enter memorable phrase..." autocomplete="off">
    </div>

    <!-- Domain / Salt Input -->
    <div class="field-block">
      <label for="salt-input" class="field-label">SERVICE SALT (AUTO-DETECTED)</label>
      <input type="text" id="salt-input" class="popup-input" placeholder="github.com">
    </div>

    <!-- Length Slider -->
    <div class="field-block">
      <div class="label-row">
        <label class="field-label">OUTPUT LENGTH</label>
        <span id="length-val" class="length-val">14</span>
      </div>
      <input type="range" id="length-slider" class="popup-slider" min="8" max="32" value="14">
    </div>

    <!-- Evolved Password Output -->
    <div class="output-card">
      <span class="output-label">EVOLVED KEY</span>
      <div id="output-display" class="output-text placeholder">Enter phrase above...</div>
    </div>

    <!-- Action Buttons -->
    <div class="actions-row">
      <button id="copy-btn" class="btn-primary" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        <span>COPY</span>
      </button>
      <button id="autofill-btn" class="btn-primary btn-autofill" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        <span>AUTO-FILL</span>
      </button>
    </div>

    <!-- Status Toast -->
    <div id="status-toast" class="status-toast"></div>

    <footer style="text-align: center; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: auto; padding-top: 4px;">
      Made with love by Rishikesh ❤️
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
