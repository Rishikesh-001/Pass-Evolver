<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141417" />
      <stop offset="100%" stop-color="#0B0B0B" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2D55" />
      <stop offset="100%" stop-color="#B00020" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="100" fill="url(#bg-grad)" stroke="#B00020" stroke-width="8"/>

  <!-- Shield Outline -->
  <path d="M256 64 L384 112 V240 C384 340 320 416 256 448 C192 416 128 340 128 240 V112 Z" 
        fill="url(#shield-grad)" 
        filter="url(#glow)" 
        opacity="0.95" />

  <!-- Inner Cyber Core Node -->
  <circle cx="256" cy="240" r="48" fill="#0B0B0B" stroke="#FF2D55" stroke-width="6"/>
  <path d="M256 216 V264 M232 240 H280" stroke="#FF2D55" stroke-width="6" stroke-linecap="round"/>

  <!-- Matrix Binary Highlights -->
  <text x="256" y="160" font-family="monospace" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">01000101</text>
  <text x="256" y="340" font-family="monospace" font-size="20" font-weight="bold" fill="#FF2D55" text-anchor="middle" letter-spacing="3">PASS EVOLVER</text>
</svg>
